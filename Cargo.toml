[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-or-later"
publish = false

[workspace.dependencies]
tessera-audio.path = "crates/tessera-audio"
tessera-document.path = "crates/tessera-document"
tessera-export.path = "crates/tessera-export"
tessera-media.path = "crates/tessera-media"
tessera-render.path = "crates/tessera-render"
tessera-timeline.path = "crates/tessera-timeline"
tessera-ui.path = "crates/tessera-ui"
anyhow = "=1.0.104"
ffmpeg-next = "=9.0.0"
futures = { version = "=0.3.34", default-features = false, features = ["std"] }
gpui = "=0.2.2"
image = "=0.25.10"
pipewire = { version = "=0.10.1", features = ["v0_3_50"] }
pollster = "=1.0.1"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
thiserror = "=2.0.21"
tracing = "=0.1.44"
tracing-subscriber = { version = "=0.3.23", features = ["env-filter"] }
wgpu = {
    version = "=30.0.1",
    default-features = false,
    features = ["std", "parking_lot", "vulkan", "wgsl"]
}

[profile.release]
opt-level = 3
codegen-units = 1
lto = "thin"
strip = "symbols"
panic = "abort"
